log_format study '$remote_addr [$time_iso8601] "$request_method $uri" $status $request_time';
map $uri $study_cache_control {
    default "no-store";
    ~^/assets/ "public, max-age=604800, immutable";
}
server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $java_server backend-java:8080;
    set $ai_server ai-service:8000;
    access_log /var/log/nginx/access.log study;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Cache-Control $study_cache_control always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://$java_server;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 200s;
        proxy_connect_timeout 5s;
    }
    location = /ai/health {
        proxy_pass http://$ai_server/health;
        proxy_read_timeout 5s;
    }
    # Internal calls require AI_SERVICE_TOKEN. Browsers use /api with their JWT.
    location /ai/ {
        proxy_pass http://$ai_server;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 200s;
        proxy_connect_timeout 5s;
    }
    location /assets/ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
