# Use AFTER obtaining a certificate. Change domain and both certificate paths.
log_format study_private '$remote_addr [$time_iso8601] "$request_method $uri" $status';
server {
    listen 80;
    listen [::]:80;
    server_name study.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name study.example.com;
    ssl_certificate /etc/letsencrypt/live/study.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/study.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:StudyTLS:10m;
    ssl_session_timeout 1d;
    server_tokens off;
    client_max_body_size 1m;
    access_log /var/log/nginx/study-access.log study_private;
    error_log /var/log/nginx/study-error.log warn;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 200s;
        proxy_connect_timeout 5s;
    }
}
