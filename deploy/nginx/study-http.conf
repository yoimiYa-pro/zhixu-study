# Install as /etc/nginx/sites-available/study, replace the domain, then enable.
# Certbot's nginx plugin adds TLS to this existing server block.
log_format study_private '$remote_addr [$time_iso8601] "$request_method $uri" $status';
server {
    listen 80;
    listen [::]:80;
    server_name study.example.com;
    server_tokens off;
    client_max_body_size 1m;
    access_log /var/log/nginx/study-access.log study_private;
    error_log /var/log/nginx/study-error.log warn;
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 200s;
        proxy_connect_timeout 5s;
    }
}
