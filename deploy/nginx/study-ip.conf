# This server already has a valid Let's Encrypt certificate for 175.24.234.152.
# Reuse the existing certificate renewal and publish only this project's gateway.
log_format study_ip '$remote_addr [$time_iso8601] "$request_method $uri" $status $request_time';

server {
    listen 9443 ssl;
    http2 on;
    server_name 175.24.234.152;

    ssl_certificate /etc/letsencrypt/live/175.24.234.152/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/175.24.234.152/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:StudyIpTLS:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 1m;
    access_log /var/log/nginx/study-ip-access.log study_ip;
    error_log /var/log/nginx/study-ip-error.log warn;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 200s;
        proxy_connect_timeout 5s;
        # Secure the public HTTPS cookie; local HTTP previews keep working.
        proxy_cookie_flags study_refresh secure httponly samesite=strict;
    }
}
